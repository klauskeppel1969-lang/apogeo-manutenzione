<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hotel Apogeo — Manutenzione Camere</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>

:root{
  --bg:#f4f1ea;
  --surface:#ffffff;
  --text:#1d1d1b;
  --muted:#777;

  --ok:#4caf50;
  --warn:#ff9800;
  --fix:#f44336;
  --out:#7b1fa2;
  --none:#cfcfcf;

  --radius:18px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:#1a1a14;
  color:white;

  padding:14px 18px;

  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#d4a017;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#111;
  font-weight:800;
  font-size:20px;
}

.head-text{
  flex:1;
}

.head-title{
  font-size:18px;
  font-weight:700;
}

.head-sub{
  font-size:12px;
  color:#999;
  margin-top:2px;
}

/* CONTENT */

.content{
  max-width:1200px;
  margin:auto;
  padding:18px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:22px;
}

.stat{
  background:white;
  border-radius:16px;
  padding:16px;
  text-align:center;
}

.stat-number{
  font-size:30px;
  font-weight:800;
}

.stat-label{
  margin-top:6px;
  font-size:12px;
  color:var(--muted);
}

/* FLOORS */

.floor-title{
  margin:24px 0 12px;
  font-size:13px;
  text-transform:uppercase;
  font-weight:700;
  color:#777;
}

/* GRID */

.rooms-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}

.room-btn{
  aspect-ratio:1/1;

  border:none;
  border-radius:20px;

  cursor:pointer;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  transition:.15s;

  min-height:95px;

  border:3px solid transparent;
}

.room-btn:hover{
  transform:scale(1.03);
}

.room-number{
  font-size:28px;
  font-weight:800;
}

.room-icon{
  font-size:24px;
  margin-top:5px;
}

.room-state{
  margin-top:5px;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
}

/* STATES */

.s-none{
  background:#ececec;
  border-color:#d6d6d6;
}

.s-ok{
  background:#e8f5e9;
  border-color:var(--ok);
  color:#1b5e20;
}

.s-warn{
  background:#fff3e0;
  border-color:var(--warn);
  color:#e65100;
}

.s-fix{
  background:#ffebee;
  border-color:var(--fix);
  color:#b71c1c;
}

.s-out{
  background:#f3e5f5;
  border-color:var(--out);
  color:#4a148c;
}

/* MOBILE */

@media(max-width:720px){

  .rooms-grid{
    gap:8px;
  }

  .room-btn{
    min-height:68px;
    border-radius:14px;
  }

  .room-number{
    font-size:18px;
  }

  .room-icon{
    font-size:16px;
  }

  .room-state{
    font-size:8px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);

  display:none;
  align-items:center;
  justify-content:center;

  padding:16px;

  z-index:500;
}

.overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:760px;

  max-height:92vh;
  overflow:auto;

  background:white;
  border-radius:22px;
}

/* MODAL HEADER */

.modal-head{
  background:#1a1a14;
  color:white;
  padding:22px;
}

.modal-title{
  font-size:28px;
  font-weight:800;
}

.modal-sub{
  margin-top:5px;
  color:#999;
  font-size:13px;
}

/* BODY */

.modal-body{
  padding:22px;
}

/* SECTIONS */

.section{
  margin-bottom:24px;
}

.section-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:12px;

  text-transform:uppercase;
  color:#666;
}

/* CHECKLIST */

.check-group{
  background:#f7f7f7;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:12px;
}

.group-head{
  padding:16px;
  font-weight:700;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.group-body{
  padding:0 16px 16px;
}

.check-item{
  display:flex;
  align-items:center;
  gap:12px;

  padding:10px 0;

  border-bottom:1px solid #ececec;
}

.check-item:last-child{
  border-bottom:none;
}

.check-item input{
  width:22px;
  height:22px;
}

/* STATUS BUTTONS */

.status-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.status-btn{
  border:none;
  border-radius:16px;
  padding:18px;

  font-size:15px;
  font-weight:800;

  cursor:pointer;
}

.status-btn.active{
  outline:4px solid #111;
}

.sb-ok{
  background:#e8f5e9;
  color:#1b5e20;
}

.sb-warn{
  background:#fff3e0;
  color:#e65100;
}

.sb-fix{
  background:#ffebee;
  color:#b71c1c;
}

.sb-out{
  background:#f3e5f5;
  color:#4a148c;
}

/* NOTES */

textarea{
  width:100%;
  min-height:110px;

  border:none;
  background:#f5f5f5;

  border-radius:16px;

  padding:16px;

  font-family:inherit;
  font-size:14px;

  resize:vertical;
}

/* FOOTER */

.modal-footer{
  position:sticky;
  bottom:0;

  background:white;
  padding:18px;

  border-top:1px solid #ececec;

  display:flex;
  gap:10px;
}

.btn{
  flex:1;

  border:none;
  border-radius:16px;

  padding:16px;

  cursor:pointer;

  font-size:15px;
  font-weight:800;
}

.btn-save{
  background:#1a1a14;
  color:white;
}

.btn-uncheck{
  background:#ececec;
  color:#555;
}

.btn-close{
  background:#ffebee;
  color:#c62828;
}

</style>
</head>

<body>

<div class="topbar">

  <div class="logo">K</div>

  <div class="head-text">
    <div class="head-title">Camere Apogeo</div>
    <div class="head-sub" id="today"></div>
  </div>

</div>

<div class="content">

  <div class="stats">

    <div class="stat">
      <div class="stat-number" id="st-none">0</div>
      <div class="stat-label">Da controllare</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="st-ok">0</div>
      <div class="stat-label">OK</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="st-warn">0</div>
      <div class="stat-label">Attenzione</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="st-fix">0</div>
      <div class="stat-label">Riparare</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="st-out">0</div>
      <div class="stat-label">Fuori servizio</div>
    </div>

  </div>

  <div class="floor-title">Primo piano</div>
  <div class="rooms-grid" id="grid-p1"></div>

  <div class="floor-title">Piano terra</div>
  <div class="rooms-grid" id="grid-p0"></div>

</div>

<!-- MODAL -->

<div class="overlay" id="overlay">

  <div class="modal">

    <div class="modal-head">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-sub" id="modal-sub"></div>
    </div>

    <div class="modal-body" id="modal-body"></div>

    <div class="modal-footer">

      <button class="btn btn-save"
        onclick="saveRoom()">
        Salva controllo
      </button>

      <button class="btn btn-uncheck"
        onclick="markUnchecked()">
        Da controllare
      </button>

      <button class="btn btn-close"
        onclick="closeModal()">
        Chiudi
      </button>

    </div>

  </div>

</div>

<script>

/* FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyDmyAFnQHzlhU6Jp6XurWZ4g3MB81TtB_w",
  authDomain: "apogeo-manutenzione.firebaseapp.com",
  projectId: "apogeo-manutenzione"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

/* ROOMS */

const P1 = [
'130','14','15','16','18',
'20','21','22','23','24',
'25','26','28a','28b','29',
'30','31','32','33','34'
];

const P0 = [
'35','36','37','38','39',
'40','41a','41b','42','43',
'44','45','46','47','48'
];

const ALL = [...P1,...P0];

/* CHECKLIST */

const CHECKLIST = [

{
title:'Bagno',
items:[
'WC',
'Scarico',
'Doccia',
'Soffione',
'Rubinetti',
'Silicone',
'Specchio'
]
},

{
title:'Luci',
items:[
'Luce ingresso',
'Luci comodino',
'Luci bagno',
'Interruttori',
'Prese'
]
},

{
title:'Climatizzazione',
items:[
'Condizionatore',
'Telecomando',
'Aria calda/fredda'
]
},

{
title:'Camera',
items:[
'Letto',
'Materasso',
'Armadio',
'Finestre',
'Tende',
'Pavimento'
]
}

];

/* STATE */

let rooms = {};
let currentRoom = null;

let tempChecks = {};
let tempStatus = null;
let tempNotes = '';

ALL.forEach(r=>{

  rooms[r]={
    status:null,
    checks:{},
    notes:'',
    updated:null
  };

});

/* INIT */

document.getElementById('today').textContent =
new Date().toLocaleDateString(
'it-IT',
{
weekday:'long',
day:'numeric',
month:'long',
year:'numeric'
}
);

listenRooms();

/* LISTENER */

function listenRooms(){

  db.collection('rooms')
  .onSnapshot(snap=>{

    snap.forEach(doc=>{

      rooms[doc.id]={
        ...rooms[doc.id],
        ...doc.data()
      };

    });

    render();

  });

}

/* RENDER */

function render(){

  renderGrid(P1,'grid-p1');
  renderGrid(P0,'grid-p0');

  updateStats();

}

function renderGrid(list,id){

  const el=document.getElementById(id);

  el.innerHTML='';

  list.forEach(room=>{

    const data=rooms[room];

    const btn=document.createElement('button');

    btn.className='room-btn s-'+(data.status || 'none');

    btn.onclick=()=>openRoom(room);

    btn.innerHTML=`

      <div class="room-number">${room}</div>

      <div class="room-icon">
        ${icon(data.status)}
      </div>

      <div class="room-state">
        ${label(data.status)}
      </div>

    `;

    el.appendChild(btn);

  });

}

/* STATS */

function updateStats(){

  let none=0;
  let ok=0;
  let warn=0;
  let fix=0;
  let out=0;

  ALL.forEach(r=>{

    const s=rooms[r].status;

    if(!s) none++;
    else if(s==='ok') ok++;
    else if(s==='warn') warn++;
    else if(s==='fix') fix++;
    else if(s==='out') out++;

  });

  document.getElementById('st-none').textContent=none;
  document.getElementById('st-ok').textContent=ok;
  document.getElementById('st-warn').textContent=warn;
  document.getElementById('st-fix').textContent=fix;
  document.getElementById('st-out').textContent=out;

}

/* ICONS */

function icon(s){

  if(s==='ok') return '✅';
  if(s==='warn') return '⚠️';
  if(s==='fix') return '🔧';
  if(s==='out') return '🚫';

  return '•';

}

function label(s){

  if(s==='ok') return 'OK';
  if(s==='warn') return 'ATTENZIONE';
  if(s==='fix') return 'RIPARARE';
  if(s==='out') return 'FUORI SERV.';

  return 'DA FARE';

}

/* MODAL */

function openRoom(room){

  currentRoom=room;

  const data=rooms[room];

  tempChecks = JSON.parse(
    JSON.stringify(data.checks || {})
  );

  tempStatus=data.status;
  tempNotes=data.notes || '';

  document.getElementById('modal-title')
    .textContent='Camera '+room;

  document.getElementById('modal-sub')
    .textContent=
      data.updated
      ? 'Ultimo controllo: '+new Date(data.updated).toLocaleString('it-IT')
      : 'Mai controllata';

  renderModal();

  document.getElementById('overlay')
    .classList.add('show');

}

function renderModal(){

  const body=document.getElementById('modal-body');

  let html='';

  /* CHECKLIST */

  html+=`
    <div class="section">
      <div class="section-title">
        Checklist controllo
      </div>
  `;

  CHECKLIST.forEach(group=>{

    html+=`
      <div class="check-group">

        <div class="group-head">
          ${group.title}
        </div>

        <div class="group-body">
    `;

    group.items.forEach(item=>{

      html+=`

        <label class="check-item">

          <input
            type="checkbox"
            ${tempChecks[item] ? 'checked' : ''}
            onchange="toggleCheck('${item}')"
          >

          <span>${item}</span>

        </label>

      `;

    });

    html+=`
        </div>
      </div>
    `;

  });

  html+=`</div>`;

  /* STATUS */

  html+=`

    <div class="section">

      <div class="section-title">
        Esito finale camera
      </div>

      <div class="status-grid">

        <button
          class="status-btn sb-ok ${tempStatus==='ok' ? 'active' : ''}"
          onclick="setStatus('ok')">

          ✅ CAMERA OK

        </button>

        <button
          class="status-btn sb-warn ${tempStatus==='warn' ? 'active' : ''}"
          onclick="setStatus('warn')">

          ⚠️ DA MONITORARE

        </button>

        <button
          class="status-btn sb-fix ${tempStatus==='fix' ? 'active' : ''}"
          onclick="setStatus('fix')">

          🔧 MANUTENZIONE

        </button>

        <button
          class="status-btn sb-out ${tempStatus==='out' ? 'active' : ''}"
          onclick="setStatus('out')">

          🚫 FUORI SERVIZIO

        </button>

      </div>

    </div>

  `;

  /* NOTES */

  html+=`

    <div class="section">

      <div class="section-title">
        Note manutenzione
      </div>

      <textarea
        placeholder="Scrivi eventuali problemi o annotazioni..."
        oninput="tempNotes=this.value"
      >${tempNotes}</textarea>

    </div>

  `;

  body.innerHTML=html;

}

/* CHECKS */

function toggleCheck(item){

  tempChecks[item]=!tempChecks[item];

}

/* STATUS */

function setStatus(status){

  tempStatus=status;

  renderModal();

}

/* SAVE */

async function saveRoom(){

  if(!tempStatus){

    alert('Seleziona un esito finale.');

    return;
  }

  await db.collection('rooms')
  .doc(currentRoom)
  .set({

    status:tempStatus,
    checks:tempChecks,
    notes:tempNotes,
    updated:new Date().toISOString()

  },{merge:true});

  closeModal();

}

/* RESET */

async function markUnchecked(){

  const ok=confirm(
    'Rimettere la camera tra quelle DA CONTROLLARE?'
  );

  if(!ok) return;

  await db.collection('rooms')
  .doc(currentRoom)
  .set({

    status:null

  },{merge:true});

  closeModal();

}

/* CLOSE */

function closeModal(){

  document.getElementById('overlay')
    .classList.remove('show');

}

/* OVERLAY */

document.getElementById('overlay')
.addEventListener('click',e=>{

  if(e.target.id==='overlay'){

    closeModal();

  }

});

</script>

</body>
</html>
